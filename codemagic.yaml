workflows:
  ios-pr-verify:
    name: iOS PR verification
    max_build_duration: 120
    instance_type: mac_mini_m2
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: false
      cancel_previous_builds: true
    environment:
      flutter: 3.44.8
      xcode: 26.5
    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Compile the iOS release app without signing
        script: flutter build ios --release --no-codesign
    artifacts:
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    integrations:
      app_store_connect: "Code Magic"
    environment:
      ios_signing:
        certificates:
          - pve-companion-app-store
        provisioning_profiles:
          - pve-companion-ios-app-store-profile
          - pve-companion-widget-app-store-profile
      vars:
        APP_STORE_APPLE_ID: "6797252365"
      flutter: 3.44.8
      xcode: 26.5
    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Verify formatting, analysis, and tests
        script: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed lib test tool
          flutter analyze
          flutter test
      - name: Apply App Store signing profiles
        script: xcode-project use-profiles --project ios/Runner.xcodeproj
      - name: Build signed IPA with the next App Store build number
        script: |
          set -euo pipefail
          APP_VERSION="$(awk '/^version:/ { split($2, version, "+"); print version[1]; exit }' pubspec.yaml)"
          test -n "$APP_VERSION"
          case "$PROJECT_BUILD_NUMBER" in
            (''|*[!0-9]*) echo "Codemagic did not provide a valid project build number." >&2; exit 1 ;;
          esac
          LATEST_BUILD_NUMBER="$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)"
          if [[ "$LATEST_BUILD_NUMBER" =~ ^[0-9]+$ ]] && (( LATEST_BUILD_NUMBER >= PROJECT_BUILD_NUMBER )); then
            BUILD_NUMBER="$((LATEST_BUILD_NUMBER + 1))"
          else
            BUILD_NUMBER="$PROJECT_BUILD_NUMBER"
          fi
          flutter build ipa --release \
            --build-name="$APP_VERSION" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration

  macos-testflight:
    name: macOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    integrations:
      app_store_connect: "Code Magic"
    environment:
      groups:
        - macos_app_store_signing
      vars:
        APP_STORE_APPLE_ID: "6797252365"
        MACOS_BUNDLE_ID: "com.knuckleheadcodedesign.pvecompanion"
      flutter: 3.44.8
      xcode: 26.5
    scripts:
      - name: Require the macOS automatic-signing private key
        script: |
          set -euo pipefail
          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "Configure CERTIFICATE_PRIVATE_KEY as a secure value in the macos_app_store_signing group." >&2
            exit 1
          fi
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Verify formatting, analysis, and tests
        script: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed lib test tool
          flutter analyze
          flutter test
      - name: Initialize the signing keychain
        script: keychain initialize
      - name: Fetch the Mac App Store profile and app certificate
        script: |
          app-store-connect fetch-signing-files "$MACOS_BUNDLE_ID" \
            --platform MAC_OS \
            --type MAC_APP_STORE \
            --create
      - name: Fetch the Mac Installer Distribution certificate
        script: |
          app-store-connect certificates list --type MAC_INSTALLER_DISTRIBUTION --save
      - name: Add or create Mac signing certificates in the keychain
        script: |
          set -euo pipefail
          keychain add-certificates
          has_installer_certificate="$(
            keychain list-certificates |
              jq -r '[.[] | .common_name | select(test("Mac (Installer Distribution|Developer Installer)"; "i"))] | length > 0'
          )"
          if [ "$has_installer_certificate" != "true" ]; then
            app-store-connect certificates create --type MAC_INSTALLER_DISTRIBUTION --save
            keychain add-certificates
          fi
      - name: Apply the Mac App Store profile to the Xcode project
        script: xcode-project use-profiles --project macos/Runner.xcodeproj
      - name: Build the signed macOS app with the next App Store build number
        script: |
          set -euo pipefail
          APP_VERSION="$(awk '/^version:/ { split($2, version, "+"); print version[1]; exit }' pubspec.yaml)"
          test -n "$APP_VERSION"
          case "$PROJECT_BUILD_NUMBER" in
            (''|*[!0-9]*) echo "Codemagic did not provide a valid project build number." >&2; exit 1 ;;
          esac
          LATEST_BUILD_NUMBER="$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)"
          if [[ "$LATEST_BUILD_NUMBER" =~ ^[0-9]+$ ]] && (( LATEST_BUILD_NUMBER >= PROJECT_BUILD_NUMBER )); then
            BUILD_NUMBER="$((LATEST_BUILD_NUMBER + 1))"
          else
            BUILD_NUMBER="$PROJECT_BUILD_NUMBER"
          fi
          flutter build macos --release \
            --build-name="$APP_VERSION" \
            --build-number="$BUILD_NUMBER"
      - name: Package the signed macOS app for App Store Connect
        script: |
          set -euo pipefail
          shopt -s nullglob
          app_candidates=(build/macos/Build/Products/Release/*.app)
          if [ "${#app_candidates[@]}" -ne 1 ]; then
            echo "Expected exactly one built macOS app, found ${#app_candidates[@]}." >&2
            exit 1
          fi
          app_path="${app_candidates[0]}"
          package_path="${app_path%.app}.pkg"
          unsigned_package_path="${app_path%.app}-unsigned.pkg"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          installer_certificate_name="$(
            keychain list-certificates |
              jq -r '[.[] | .common_name | select(test("Mac (Installer Distribution|Developer Installer)"; "i"))] | first // empty'
          )"
          if [ -z "$installer_certificate_name" ]; then
            echo "No Mac Installer Distribution certificate is available in the signing keychain." >&2
            exit 1
          fi
          xcrun productbuild --component "$app_path" /Applications "$unsigned_package_path"
          xcrun productsign --sign "$installer_certificate_name" "$unsigned_package_path" "$package_path"
          pkgutil --check-signature "$package_path"
          rm "$unsigned_package_path"
    artifacts:
      - build/macos/**/*.pkg
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration

  ios-app-store-release:
    name: iOS App Store release
    max_build_duration: 120
    instance_type: mac_mini_m2
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
    integrations:
      app_store_connect: "Code Magic"
    environment:
      ios_signing:
        certificates:
          - pve-companion-app-store
        provisioning_profiles:
          - pve-companion-ios-app-store-profile
          - pve-companion-widget-app-store-profile
      vars:
        APP_STORE_APPLE_ID: "6797252365"
      flutter: 3.44.8
      xcode: 26.5
    scripts:
      - name: Verify the release tag matches pubspec.yaml
        script: |
          set -euo pipefail
          APP_VERSION="$(awk '/^version:/ { split($2, version, "+"); print version[1]; exit }' pubspec.yaml)"
          test -n "$APP_VERSION"
          test "$CM_TAG" = "v$APP_VERSION"
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Verify formatting, analysis, and tests
        script: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed lib test tool
          flutter analyze
          flutter test
      - name: Apply App Store signing profiles
        script: xcode-project use-profiles --project ios/Runner.xcodeproj
      - name: Build signed IPA with the next App Store build number
